[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-bybit-public-recorder-spike"
version = "0.1.0"
description = "Public-only Bybit V5 market-data recorder primitives for NEXUS qualification"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
live = ["websockets==17.4"]

[project.scripts]
nexus-bybit-record = "nexus_bybit_recorder.live:main"
nexus-bybit-replay = "nexus_bybit_recorder.replay:main"

[tool.setuptools.packages.find]
where = ["src"]
