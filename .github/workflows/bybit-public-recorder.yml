name: Bybit public recorder spike

on:
  pull_request:
    paths:
      - "src/nexus_bybit_recorder/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/bybit-public-recorder.yml"
  push:
    branches: ["prototype/bybit-public-data-recorder-python-v0"]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
